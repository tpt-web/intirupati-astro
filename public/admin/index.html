<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/admin/" />
  <title>InTirupati Admin</title>
</head>
<body>
  <script>
    if (window.location.pathname === '/admin') {
      window.location.replace('/admin/');
    }
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <noscript>Please enable JavaScript to access the content editor.</noscript>
  <script>
    const cmsConfig = {
      backend: {
        name: "github",
        repo: "tpt-web/intirupati-astro",
        branch: "main",
        auth_endpoint: "/auth",
        api_root: "https://api.github.com",
        open_authoring: false
      },
      media_folder: "public/uploads",
      public_folder: "/uploads",
      collections: [
        {
          name: "blog",
          label: "Blog Posts",
          folder: "src/content/blog",
          create: true,
          slug: "{{slug}}",
          fields: [
            { label: "Title", name: "title", widget: "string" },
            { label: "Description", name: "description", widget: "text" },
            { label: "Publish Date", name: "pubDate", widget: "datetime" },
            { label: "Hero Image", name: "heroImage", widget: "image" },
            { label: "Body", name: "body", widget: "markdown" }
          ]
        },
        {
          name: "shayari",
          label: "Shayari",
          folder: "src/content/shayari",
          create: true,
          slug: "{{slug}}",
          fields: [
            { label: "Title", name: "title", widget: "string" },
            { label: "Description", name: "description", widget: "text" },
            { label: "Publish Date", name: "pubDate", widget: "datetime", required: false },
            { label: "Hero Image", name: "heroImage", widget: "image", required: false },
            { label: "Body", name: "body", widget: "markdown" }
          ]
        },
        {
          name: "quotes",
          label: "Quotes",
          folder: "src/content/quotes",
          create: true,
          slug: "{{slug}}",
          fields: [
            { label: "Title", name: "title", widget: "string" },
            { label: "Description", name: "description", widget: "text" },
            { label: "Publish Date", name: "pubDate", widget: "datetime", required: false },
            { label: "Hero Image", name: "heroImage", widget: "image", required: false },
            { label: "Body", name: "body", widget: "markdown" }
          ]
        },
        {
          name: "tools",
          label: "SEO Tools",
          folder: "src/content/tools",
          create: true,
          slug: "{{slug}}",
          fields: [
            { label: "Title", name: "title", widget: "string" },
            { label: "Description", name: "description", widget: "text" },
            { label: "Publish Date", name: "pubDate", widget: "datetime", required: false },
            { label: "Hero Image", name: "heroImage", widget: "image", required: false },
            { label: "Body", name: "body", widget: "markdown" }
          ]
        },
        {
          name: "prompts",
          label: "Devotional Prompts",
          folder: "src/content/prompts",
          create: true,
          slug: "{{slug}}",
          fields: [
            { label: "Title", name: "title", widget: "string" },
            { label: "Description", name: "description", widget: "text" },
            { label: "Publish Date", name: "pubDate", widget: "datetime", required: false },
            { label: "Hero Image", name: "heroImage", widget: "image", required: false },
            { label: "Body", name: "body", widget: "markdown" }
          ]
        }
      ]
    };

    const initCMS = () => {
      if (window.CMS && typeof CMS.init === 'function') {
        CMS.init({ config: cmsConfig });
      } else {
        setTimeout(initCMS, 50);
      }
    };

    initCMS();
  </script>
</body>
</html>
