<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/admin/" />
  <title>InTirupati Admin</title>
</head>
<body>
  <script>
    if (window.location.pathname === '/admin') {
      window.location.replace('/admin/');
    }
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <noscript>Please enable JavaScript to access the content editor.</noscript>
  <script>
    (async function(){
      try {
        const res = await fetch('/admin/config.yml', { cache: 'no-store' });
        const text = await res.text();
        const pre = document.createElement('pre');
        pre.style.whiteSpace = 'pre-wrap';
        pre.style.background = '#f8f8f8';
        pre.style.padding = '8px';
        pre.style.border = '1px solid #ddd';
        pre.textContent = 'Loaded /admin/config.yml:\n\n' + text.slice(0, 2000);
        document.body.appendChild(pre);
        console.log('Loaded /admin/config.yml:', text);
      } catch (err) {
        const el = document.createElement('div');
        el.textContent = 'Failed to fetch /admin/config.yml: ' + err.message;
        el.style.color = 'red';
        document.body.appendChild(el);
        console.error(err);
      }
    })();
  </script>
  <script>
    // Intercept attempts to open Netlify auth and route to our /auth endpoint
    (function(){
      var _open = window.open.bind(window);
      window.open = function(url, name, specs) {
        try {
          if (typeof url === 'string' && url.indexOf('api.netlify.com') !== -1) {
            return _open('/auth', name || '_blank', specs);
          }
        } catch (e) {
          console.error('auth intercept error', e);
        }
        return _open(url, name, specs);
      };
      // Also replace any direct anchor links to api.netlify.com
      document.addEventListener('click', function(e){
        var a = e.target.closest && e.target.closest('a');
        if (!a) return;
        try {
          if (a.href && a.href.indexOf('api.netlify.com') !== -1) {
            e.preventDefault();
            window.open('/auth', a.target || '_blank');
          }
        } catch (err) { /* ignore */ }
      }, true);
    })();
  </script>
</body>
</html>
